version: '3.8'

services:
  # MongoDB 服务
  mongodb:
    image: mongo:7.0
    container_name: d-im-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: go_im
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - d-im-network

  # Redis 服务
  redis:
    image: redis:7.2-alpine
    container_name: d-im-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - d-im-network

  # API 服务器
  api-server:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api-server
    container_name: d-im-api-server
    restart: unless-stopped
    environment:
      - API_SERVER_PORT=8080
      - WS_SERVER_PORT=9000
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/go_im?authSource=admin
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - JWT_PUBLIC_KEY_PATH=/app/config/keys/public.pem
    ports:
      - "8080:8080"
    volumes:
      - ../config:/app/config
    depends_on:
      - mongodb
      - redis
    networks:
      - d-im-network

  # WebSocket 服务器
  ws-server:
    build:
      context: ..
      dockerfile: Dockerfile
      target: ws-server
    container_name: d-im-ws-server
    restart: unless-stopped
    environment:
      - API_SERVER_PORT=8080
      - WS_SERVER_PORT=9000
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/go_im?authSource=admin
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - JWT_PUBLIC_KEY_PATH=/app/config/keys/public.pem
    ports:
      - "9000:9000"
    volumes:
      - ../config:/app/config
    depends_on:
      - mongodb
      - redis
    networks:
      - d-im-network

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: d-im-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../config/keys:/etc/nginx/ssl:ro
    depends_on:
      - api-server
      - ws-server
    networks:
      - d-im-network

volumes:
  mongodb_data:
  redis_data:

networks:
  d-im-network:
    driver: bridge
