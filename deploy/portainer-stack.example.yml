services:
  dim-frontend:
    image: registry.cn-beijing.aliyuncs.com/jianboo/dim-frontend:latest
    container_name: dim-frontend
    restart: unless-stopped
    ports:
      - "8900:80"
    networks:
      - dim

  dim-api:
    image: registry.cn-beijing.aliyuncs.com/jianboo/dim-api:latest
    container_name: dim-api
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      API_SERVER_PORT: "8080"
      WS_SERVER_PORT: "9000"
      MONGODB_URI: mongodb://USER:PASSWORD@MONGO_HOST:27017
      MONGODB_DATABASE: x_im
      REDIS_ADDR: REDIS_HOST:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      JWT_SECRET: please-change-me
      JWT_EXPIRE: "3600"
      JWT_MAX_SESSION: "86400"
      JWT_ISSUER: d-im
      INTEGRATION_API_KEY: please-change-me
      IM_FRONTEND_BASE_URL: https://chat.d-im.com
      APP_NAME: d-im
      APP_DEFAULT_AVATAR: ""
      OSS_ENDPOINT: ""
      OSS_ACCESS_KEY_ID: ""
      OSS_ACCESS_KEY_SECRET: ""
      OSS_BUCKET_NAME: ""
      OSS_CUSTOM_DOMAIN: ""
      OSS_DIRECTORY: uploads
    ports:
      - "8901:8080"
    networks:
      - dim

  dim-ws:
    image: registry.cn-beijing.aliyuncs.com/jianboo/dim-ws:latest
    container_name: dim-ws
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      API_SERVER_PORT: "8080"
      WS_SERVER_PORT: "9000"
      MONGODB_URI: mongodb://USER:PASSWORD@MONGO_HOST:27017
      MONGODB_DATABASE: x_im
      REDIS_ADDR: REDIS_HOST:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      JWT_SECRET: please-change-me
      JWT_EXPIRE: "3600"
      JWT_MAX_SESSION: "86400"
      JWT_ISSUER: d-im
      INTEGRATION_API_KEY: please-change-me
      IM_FRONTEND_BASE_URL: https://chat.d-im.com
      APP_NAME: d-im
      APP_DEFAULT_AVATAR: ""
      OSS_ENDPOINT: ""
      OSS_ACCESS_KEY_ID: ""
      OSS_ACCESS_KEY_SECRET: ""
      OSS_BUCKET_NAME: ""
      OSS_CUSTOM_DOMAIN: ""
      OSS_DIRECTORY: uploads
    ports:
      - "8902:9000"
    networks:
      - dim

networks:
  dim:
    driver: bridge
