version: "3.8"

services:
  dim-frontend:
    image: "registry.cn-beijing.aliyuncs.com/jianboo/dim-frontend:latest"
    container_name: "dim-frontend"
    restart: unless-stopped
    ports:
      - "8900:80"
    networks:
      - dim

  dim-api:
    image: "registry.cn-beijing.aliyuncs.com/jianboo/dim-api:latest"
    container_name: "dim-api"
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
      API_SERVER_PORT: "${API_SERVER_PORT}"
      WS_SERVER_PORT: "${WS_SERVER_PORT}"
      WS_HEARTBEAT_INTERVAL: "${WS_HEARTBEAT_INTERVAL}"
      WS_PONG_TIMEOUT: "${WS_PONG_TIMEOUT}"
      WS_WRITE_TIMEOUT: "${WS_WRITE_TIMEOUT}"
      MONGODB_URI: "${MONGODB_URI}"
      MONGODB_DATABASE: "${MONGODB_DATABASE}"
      REDIS_ADDR: "${REDIS_ADDR}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_DB: "${REDIS_DB}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRE: "${JWT_EXPIRE}"
      JWT_REFRESH_EXPIRE: "${JWT_REFRESH_EXPIRE}"
      JWT_MAX_SESSION: "${JWT_MAX_SESSION}"
      JWT_MAX_ACTIVE_SESSIONS: "${JWT_MAX_ACTIVE_SESSIONS}"
      JWT_ISSUER: "${JWT_ISSUER}"
      JWT_REFRESH_COOKIE_NAME: "${JWT_REFRESH_COOKIE_NAME}"
      JWT_REFRESH_COOKIE_DOMAIN: "${JWT_REFRESH_COOKIE_DOMAIN}"
      JWT_REFRESH_COOKIE_SECURE: "${JWT_REFRESH_COOKIE_SECURE}"
      JWT_REFRESH_COOKIE_SAMESITE: "${JWT_REFRESH_COOKIE_SAMESITE}"
      INTEGRATION_API_KEY: "${INTEGRATION_API_KEY}"
      IM_FRONTEND_BASE_URL: "${IM_FRONTEND_BASE_URL}"
      IM_PUBLIC_BASE_URL: "${IM_PUBLIC_BASE_URL}"
      APP_NAME: "${APP_NAME}"
      APP_DEFAULT_AVATAR: "${APP_DEFAULT_AVATAR}"
      OSS_ENDPOINT: "${OSS_ENDPOINT}"
      OSS_ACCESS_KEY_ID: "${OSS_ACCESS_KEY_ID}"
      OSS_ACCESS_KEY_SECRET: "${OSS_ACCESS_KEY_SECRET}"
      OSS_BUCKET_NAME: "${OSS_BUCKET_NAME}"
      OSS_CUSTOM_DOMAIN: "${OSS_CUSTOM_DOMAIN}"
      OSS_DIRECTORY: "${OSS_DIRECTORY}"
      IM_GROUP_AVATAR_DIR: "${IM_GROUP_AVATAR_DIR}"
      IM_GROUP_AVATAR_SIZE: "${IM_GROUP_AVATAR_SIZE}"
      IM_GROUP_AVATAR_KEEP_VERSIONS: "${IM_GROUP_AVATAR_KEEP_VERSIONS}"
    ports:
      - "8901:8080"
    networks:
      - dim

  dim-ws:
    image: "registry.cn-beijing.aliyuncs.com/jianboo/dim-ws:latest"
    container_name: "dim-ws"
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
      API_SERVER_PORT: "${API_SERVER_PORT}"
      WS_SERVER_PORT: "${WS_SERVER_PORT}"
      WS_HEARTBEAT_INTERVAL: "${WS_HEARTBEAT_INTERVAL}"
      WS_PONG_TIMEOUT: "${WS_PONG_TIMEOUT}"
      WS_WRITE_TIMEOUT: "${WS_WRITE_TIMEOUT}"
      MONGODB_URI: "${MONGODB_URI}"
      MONGODB_DATABASE: "${MONGODB_DATABASE}"
      REDIS_ADDR: "${REDIS_ADDR}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_DB: "${REDIS_DB}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRE: "${JWT_EXPIRE}"
      JWT_REFRESH_EXPIRE: "${JWT_REFRESH_EXPIRE}"
      JWT_MAX_SESSION: "${JWT_MAX_SESSION}"
      JWT_MAX_ACTIVE_SESSIONS: "${JWT_MAX_ACTIVE_SESSIONS}"
      JWT_ISSUER: "${JWT_ISSUER}"
      JWT_REFRESH_COOKIE_NAME: "${JWT_REFRESH_COOKIE_NAME}"
      JWT_REFRESH_COOKIE_DOMAIN: "${JWT_REFRESH_COOKIE_DOMAIN}"
      JWT_REFRESH_COOKIE_SECURE: "${JWT_REFRESH_COOKIE_SECURE}"
      JWT_REFRESH_COOKIE_SAMESITE: "${JWT_REFRESH_COOKIE_SAMESITE}"
      INTEGRATION_API_KEY: "${INTEGRATION_API_KEY}"
      IM_FRONTEND_BASE_URL: "${IM_FRONTEND_BASE_URL}"
      IM_PUBLIC_BASE_URL: "${IM_PUBLIC_BASE_URL}"
      APP_NAME: "${APP_NAME}"
      APP_DEFAULT_AVATAR: "${APP_DEFAULT_AVATAR}"
      OSS_ENDPOINT: "${OSS_ENDPOINT}"
      OSS_ACCESS_KEY_ID: "${OSS_ACCESS_KEY_ID}"
      OSS_ACCESS_KEY_SECRET: "${OSS_ACCESS_KEY_SECRET}"
      OSS_BUCKET_NAME: "${OSS_BUCKET_NAME}"
      OSS_CUSTOM_DOMAIN: "${OSS_CUSTOM_DOMAIN}"
      OSS_DIRECTORY: "${OSS_DIRECTORY}"
      IM_GROUP_AVATAR_DIR: "${IM_GROUP_AVATAR_DIR}"
      IM_GROUP_AVATAR_SIZE: "${IM_GROUP_AVATAR_SIZE}"
      IM_GROUP_AVATAR_KEEP_VERSIONS: "${IM_GROUP_AVATAR_KEEP_VERSIONS}"
    ports:
      - "8902:9000"
    networks:
      - dim

networks:
  dim:
    driver: bridge
